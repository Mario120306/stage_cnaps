<div class="incident-detail-container">
  <div *ngIf="isLoading">Chargement...</div>

  <div *ngIf="!isLoading && incident" class="detail-card">
    <!-- Détails de l'incident -->
    <h3>Incident #{{ incident.id }}</h3>
    
    <div class="section">
      <h4>Fichiers joints</h4>
      <div *ngIf="files.length === 0" class="no-files">
        Aucun fichier joint
      </div>
      
      <div *ngIf="files.length > 0" class="file-list">
        <div *ngFor="let file of files" class="file-item">
          <div class="file-icon">
            <i [class]="getFileIconClass(file.type)"></i>
          </div>
          <div class="file-info">
            <div class="file-name">{{ file.name }}</div>
            <div class="file-meta">
              {{ formatFileSize(file.size) }} - {{ formatDate(file.uploadDate) }}
            </div>
          </div>
          <button (click)="downloadFile(file.id)" class="download-btn">
            <i class="fas fa-download"></i> Télécharger
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
