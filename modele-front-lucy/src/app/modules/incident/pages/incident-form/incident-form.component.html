    <!-- Section Classification -->
    <div class="form-section">
      <h3><i class="now-ui-icons design_bullet-list-67"></i> Classification</h3>
      <fieldset>
        <legend id="legend">
          <i class="fa fa-save pr-2"></i> comment le classifierez-vous?
        </legend>
        <div class="form-row">
          <!-- Sélecteur de catégorie -->
          <div class="form-group">
            <label>Catégorie</label>
            <select class="form-control" 
                    [(ngModel)]="incident.categorie" 
                    name="categorie"
                    (change)="onCategorieChange()">
              <option [ngValue]="null">-- Sélectionnez --</option>
              <option *ngFor="let cat of categories" [ngValue]="cat">
                {{cat.libelle}}
              </option>
            </select>
          </div>

          <!-- Sélecteur de type (filtré) -->
          <div class="form-group">
            <label>Type d'incident</label>
            <select class="form-control" 
                    [(ngModel)]="incident.type" 
                    name="type"
                    [disabled]="!incident.categorie">
              <option [ngValue]="null">-- Sélectionnez --</option>
              <option *ngFor="let type of filteredTypes" [ngValue]="type">
                {{type.libelle}}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label><i class="now-ui-icons location_pin"></i> Origine</label>
            <select class="form-control" [(ngModel)]="incident.origineIncident" name="origineIncident" 
                    (change)="onOriginChange()">
              <option *ngFor="let origine of originesIncident" [ngValue]="origine">
                {{origine.libelle}}
              </option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label><i class="now-ui-icons ui-1_alert-circle-08"></i> Origine Malveillance</label>
          <select class="form-control" [(ngModel)]="incident.origineMalveillance" name="origineMalveillance"
                  [disabled]="incident.origineIncident?.libelle !== 'Malveillance'">
            <option *ngFor="let malveillance of originesMalveillance" [ngValue]="malveillance">
              {{malveillance.libelle}}
            </option>
          </select>
        </div>
      </fieldset>
    </div>

    <!-- Section Pièces Jointes -->
    <div class="form-section">
    <h3><i class="now-ui-icons files_box"></i> Pièces Jointes</h3>
    <fieldset>
        <legend id="legend">
            <i class="fa fa-save pr-2"></i> Dites-nous plus sur l'incident
        </legend>
        <div class="form-group">
            <label><i class="now-ui-icons arrows-1_cloud-upload-94"></i> Fichiers</label>
            <input type="file" class="form-control" 
                (change)="onFileChange($event)" 
                multiple
                accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
            
            <!-- Zone d'affichage des fichiers -->
            <div class="file-preview-container" *ngIf="uploadedFiles.length > 0">
            <div class="file-preview" *ngFor="let file of uploadedFiles; let i = index">
                <div class="file-info">
                <i class="now-ui-icons files_single-copy-04"></i>
                <span class="file-name">{{ file.name }}</span>
                <span class="file-size">{{ formatFileSize(file.size) }}</span>
                </div>
                <button class="btn-icon danger" (click)="removeFile(i)">
                <i class="now-ui-icons ui-1_simple-remove"></i>
                </button>
            </div>
            </div>
        </div>
      </fieldset>
    </div>

    <!-- Boutons de soumission -->
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        <i class="now-ui-icons ui-1_simple-remove"></i> Annuler
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="!incidentForm.valid">
        <i class="now-ui-icons ui-1_check"></i> Enregistrer
      </button>
    </div>
